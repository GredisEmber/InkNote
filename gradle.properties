# ============================================================================
# Gradle 构建参数 —— InkNote
#
# 这份配置对齐了本机 Android Studio 2026.1 生成的 AGP 9 工程模板。
# AGP 9 里 android.useAndroidX / android.nonTransitiveRClass 这两个开关已经
# 不再需要写（AndroidX 是唯一选项、非传递 R 类是默认行为），写了反而会有
# "obsolete property" 警告，所以这里刻意不写。
# ============================================================================

# Gradle 守护进程堆内存
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 配置缓存：AGP 9 + 内置 Kotlin 已经支持得很好，能显著加快增量构建
org.gradle.configuration-cache=true

# Kotlin 官方代码风格
kotlin.code.style=official

# ============================================================================
# AGP 9 内置 Kotlin 与 KSP 的兼容开关
#
# KSP 的 Gradle 插件用 kotlin.sourceSets DSL 注册它生成的源码目录
# （build/generated/ksp/<variant>/kotlin），而 AGP 9 的内置 Kotlin
# 出于一致性考虑禁止这个 DSL，会直接报：
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed
#    with built-in Kotlin."
# 官方给出的开关就是下面这一行。
#
# ⚠️ 这个开关只是"不报错"，并不保证 AGP 真的会把 KSP 生成的源码接进编译。
# 真正的验证标准是：Room 生成的 Impl 类能被引用到（即 Room 能正常工作）。
# 如果哪天 KSP 升级后这个属性不再需要，删掉它即可。
# ============================================================================
android.disallowKotlinSourceSets=false
